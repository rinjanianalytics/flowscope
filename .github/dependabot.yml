# Dependency updates, weekly, grouped so each ecosystem opens at most one
# pull request a week besides security updates (which Dependabot opens as
# soon as an advisory appears).
#
# Not here:
# - The Rust toolchain. `rust-toolchain.toml`, the `rust` image of the
#   Dockerfile and the toolchain of `.github/workflows/rust.yml` change
#   together, by hand.
# - The images of the Docker Compose setup (`docker/versions.yml`). Their
#   comments limit some to a release line, such as the long-term releases
#   of ClickHouse, which Dependabot cannot follow. They are updated by hand,
#   with Akvorado's.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Jakarta }
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Jakarta }
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Jakarta }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Jakarta }
    ignore:
      - dependency-name: rust
