---
services:
  flowscope-console:
    environment:
      AKVORADO_CFG_CONSOLE_DATABASE_DSN: file::memory:?cache=shared
  flowscope-exporter-1: &exporter
    extends:
      file: versions.yml
      service: flowscope
    profiles: [ demo ]
    restart: unless-stopped
    command: demo-exporter /etc/flowscope/demo-1.yaml
    volumes:
      - ../config:/etc/flowscope:ro
    depends_on:
      flowscope-inlet:
        condition: service_healthy
      flowscope-outlet:
        condition: service_healthy
    labels:
      - metrics.enable=true
      - metrics.path=/api/v0/metrics
  flowscope-exporter-2:
    <<: *exporter
    command: demo-exporter /etc/flowscope/demo-2.yaml
    environment:
      AKVORADO_CFG_DEMOEXPORTER_FLOWS_SEED: 100
  flowscope-exporter-3:
    <<: *exporter
    command: demo-exporter /etc/flowscope/demo-3.yaml
    environment:
      AKVORADO_CFG_DEMOEXPORTER_FLOWS_SEED: 200
  flowscope-exporter-4:
    <<: *exporter
    command: demo-exporter /etc/flowscope/demo-4.yaml
    environment:
      AKVORADO_CFG_DEMOEXPORTER_FLOWS_SEED: 300
