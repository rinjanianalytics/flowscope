---
services:
  # main services
  kafka:
    image: apache/kafka:4.3.1 # \d+\.\d+\.\d+
  redis:
    image: valkey/valkey:9.0 # \d+\.\d+
  clickhouse:
    image: clickhouse/clickhouse-server:26.8 # \d+\.[38]
  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:26.8 # \d+\.[38]
  traefik:
    image: traefik:v3.7 # v\d+\.\d+
  maxmind-geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7
  ipinfo-geoipupdate:
    image: ghcr.io/rinjanianalytics/flowscope-ipinfo-geoipupdate:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.ipinfo-geoipupdate
  flowscope:
    image: ghcr.io/rinjanianalytics/flowscope:main
    # The image is built from this repository when it is not there yet.
    build:
      context: ..
      dockerfile: docker/Dockerfile

  # observability
  grafana:
    image: grafana/grafana-oss:13.0.1 # \d+\.\d+\.\d+
  alloy:
    image: grafana/alloy:v1.20.1 # v\d+\.\d+\.\d+
  loki:
    image: grafana/loki:3.7 # \d+\.\d+
  prometheus:
    image: prom/prometheus:v3.15.0 # v\d+\.\d+\.\d+
  node-exporter:
    image: prom/node-exporter:v1.12.1 # v\d+\.\d+\.\d+
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0 # v\d+\.\d+\.\d+
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0 # v\d+\.\d+\.\d+
    # image: ghcr.io/kafbat/kafka-ui:v1.4.2
    # image: ecr-public.aws.com/kafbat/kafka-ui:v1.4.2
  vector:
    image: timberio/vector:0.58.X-alpine # \d+\.\d+\.X-alpine

  # for tests
  srlinux:
    image: ghcr.io/nokia/srlinux:26.3.1
  postgres:
    image: postgres:17 # \d+
  mysql:
    image: mariadb:12 # \d+
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.0 # \d+\.\d+\.\d+
