# Agent for the SNMP client tests.
sysName test-router.example.com
rocommunity public default
rocommunity6 public default
createUser md5des MD5 authpassword DES privpassword
createUser shaaes SHA authpassword AES privpassword
createUser sha256aes SHA-256 authpassword AES privpassword
createUser sha512 SHA-512 authpassword
createUser noauth
rouser md5des priv
rouser shaaes priv
rouser sha256aes priv
rouser sha512 auth
rouser noauth noauth
